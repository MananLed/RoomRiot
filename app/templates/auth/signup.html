<!DOCTYPE html>
<html>
<head>
  <title>RoomRiot | Signup</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;">
    <div class="card" style="width:360px;">
      <h2 style="margin-bottom:16px;">🔥 RoomRiot</h2>
      <p style="color:var(--muted);margin-bottom:20px;">
        Create your account to join the riot
      </p>

      <input placeholder="Username" id="username">
      <br><br>
      <input placeholder="Password" type="password" id="password">
      <br><br>
      <input placeholder="Confirm Password" type="password" id="confirm-password">
      <br><br>

      <button style="width:100%;">Sign Up</button>

      <p style="margin-top:16px;text-align:center;">
        Already have an account? <a href="login">Login</a>
      </p>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
